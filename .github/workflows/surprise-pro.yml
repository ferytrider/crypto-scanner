
name: SURPRISE PRO Scanner

on:
  schedule:
    - cron: "31 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run SURPRISE PRO
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python surprise_pro.py

      - name: Save SURPRISE PRO state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surprise_pro_state.json
          git diff --cached --quiet || git commit -m "Update SURPRISE PRO state"
          git pull --rebase origin main
          git push origin HEAD:main
